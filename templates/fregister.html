<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- LINK CSS -->
    <link rel="stylesheet" href="../static/css/fregister.css">
</head>
<body>
<div class="register-card">
    <div class="avatar"><i class="bi bi-person-plus-fill"></i></div>
    <h2>Crear Cuenta</h2>
    <form action="">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="" class="text-white mb-2">Nombres:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="" id="" class="form-control" placeholder="Ingrese sus nombres" required>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="" class="text-white mb-2">Apellidos:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-vcard-fill"></i></span>
                    <input type="text" name="" id="" class="form-control" placeholder="Ingrese sus apellidos" required>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="" class="text-white mb-2">Correo elecrtónico:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" name="" id="" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="" class="text-white mb-2">Telefóno:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                    <input type="tel" name="" id="" class="form-control" placeholder="999999999" required>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="" class="text-white mb-2">Usuario:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
                    <input type="text" name="" id="" class="form-control" placeholder="Nombre de Usuario" required>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="" class="text-white mb-2">Rol:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                    <select name="" id="" class="form-select">
                        <option value="">Administrador</option>
                        <option value="">Usuario</option>
                        <option value="">Invitado</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="" class="text-white mb-2">Contraseña:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="" id="password" class="form-control" placeholder="*********" required>
                </div>
                <i class="bi bi-eye toggle" id="togglePassword"></i>
            </div>
            <div class="col-md-6 mb-3">
                <label for="" class="text-white mb-2">Confirmar Contraseña:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                    <input type="password" name="" id="confirmPassword" class="form-control" placeholder="*********" required>
                </div>
                <i class="bi bi-eye toggle" id="toggleConfirm"></i>
            </div>
        </div>
        <div class="form-check my-3">
            <input type="checkbox" name="" id="terms" class="form-check-input">
            <label for="terms" class="form-check-label">Acepto los términos y condiciones</label>
        </div>
        <button class="btn btn-primary w-100 btn-register"><i class="bi bi-person-check-fill"></i>Crear Cuenta</button>
        <div class="text-center mt-4">
            <span class="text-white">¿Ya tienes cuenta?</span>
            <a href="./formlogin.html">Inicio Sesión</a>
        </div>


    </form>
</div>




<body>




        <!-- Bootstrasp 5.3 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../static/js/form.js"></script>
</body>
</html>
