<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form login</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- LINK CSS -->
    <link rel="stylesheet" href="../static/css/flogin.css">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="login-card">
        <div class="avatar"><i class="bi bi-person-fill"></i></div>
        <h2>Bienvenido</h2>
        <form action="">
            <dic class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i>
                    </span>
                    <input type="email" name="" id="" class="form-control" placeholder="cuenta@ejemplo.com" required>
                </div>
            </dic>
            <div class="mb-3 position relative">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="" id="password" class="form-control" placeholder="contraseña" required>
                </div>
                <i class="bi bi-eye toggle" id="togglePassword"></i>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" name="" id="remember" class="form-check-input">
                <label for="" class="form-check-label text-white">Recordarme</label>
            </div>
            <button class="btn btn-primary w-100 btn-login"><i class="bi bi-box-arrow-in-right"></i>Iniciar Sesion</button>
            <div class="links">
                <a href="">¿Olvidaste tu contraseña?</a>
                <a href="./fregister.html">Crear cuenta</a>
            </div>



        </form>
    </div>
    <!-- Bootstrasp 5.3 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../static/js/form.js"></script>
</body>
</html>
